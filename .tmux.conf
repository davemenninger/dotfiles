set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tpm'

# commands go _after_ the plugins

set status-utf8 on
set utf8 on

bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# Fine adjustment (1 or 2 cursor cells per bump)
bind -n S-Down resize-pane -D 1
bind -n S-Left resize-pane -L 9
bind -n S-Right resize-pane -R 9
bind -n S-Up resize-pane -U 1

bind N new

# set-option -sa terminal-overrides ",xterm*:Tc"
# set -g default-terminal "xterm-256color"
# set -g message-style "bg=#f9e2af,fg=#585b70"
# set -g mode-style "bg=#a6e3a1,fg=black"
set-option -g default-terminal 'screen-256color'
set-option -g detach-on-destroy off
set-option -g terminal-overrides ',xterm-256color:RGB'
set-window-option -g mode-keys vi
set -g @offline_icon "offline!"
set -g @online_icon "online."
set -g default-terminal "${TERM}"
set -g display-time 1000
set -g history-limit 20000
set -g mouse on
set -g pane-active-border-style "fg=#4e4e5e,bg=#1e1e2e"
set -g pane-border-style "fg=#1f1f2f"
set -g set-clipboard on
set -g status-justify left
set -g status-left-length 60
set -g status-left "#[fg=color115]sessions: #{session_name}/#{server_sessions} #[fg=color96]| windows: #{window_name}/#{session_windows} #[fg=color104]| panes: #{pane_title} #{pane_index}/#{window_panes}  "
set -g status-position top
set -g status-right "#{online_status} #{battery_color_fg}#{battery_color_bg}#{battery_percentage}#[fg=color175,bold] 󱑒 %a %Y-%m-%d 󱑒 %l:%M %p"
set -g status-style "bg=#1e1e2e"
set -g window-status-current-style "fg=#b4befe"
setw -g mode-keys vi

# TPM
# TPM stuff stays at the bottom
# https://github.com/tmux-plugins/tpm#installing-plugins

# automatically install tpm if it isn't
# https://github.com/tmux-plugins/tpm/blob/master/docs/automatic_tpm_installation.md
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# keep this last
run '~/.tmux/plugins/tpm/tpm'
